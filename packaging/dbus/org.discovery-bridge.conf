<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="discovery-bridge-collector">
    <deny send_destination="org.freedesktop.Avahi"/>
    <allow send_destination="org.freedesktop.Avahi" send_interface="org.freedesktop.Avahi.Server" send_member="GetState"/>
    <allow send_destination="org.freedesktop.Avahi" send_interface="org.freedesktop.Avahi.Server2" send_member="RecordBrowserPrepare"/>
    <allow send_destination="org.freedesktop.Avahi" send_interface="org.freedesktop.Avahi.RecordBrowser" send_member="Start"/>
    <allow send_destination="org.freedesktop.Avahi" send_interface="org.freedesktop.Avahi.RecordBrowser" send_member="Free"/>
  </policy>
  <policy user="discovery-bridge-publisher">
    <deny send_destination="org.freedesktop.Avahi"/>
    <allow send_destination="org.freedesktop.Avahi" send_interface="org.freedesktop.Avahi.Server" send_member="GetState"/>
    <allow send_destination="org.freedesktop.Avahi" send_interface="org.freedesktop.Avahi.Server" send_member="EntryGroupNew"/>
    <allow send_destination="org.freedesktop.Avahi" send_interface="org.freedesktop.Avahi.EntryGroup" send_member="AddRecord"/>
    <allow send_destination="org.freedesktop.Avahi" send_interface="org.freedesktop.Avahi.EntryGroup" send_member="Commit"/>
    <allow send_destination="org.freedesktop.Avahi" send_interface="org.freedesktop.Avahi.EntryGroup" send_member="Reset"/>
    <allow send_destination="org.freedesktop.Avahi" send_interface="org.freedesktop.Avahi.EntryGroup" send_member="Free"/>
  </policy>
</busconfig>
