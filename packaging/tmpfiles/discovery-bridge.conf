# Both accounts share SQLite state; retain existing files and their contents.
d /var/lib/discovery-bridge 0770 root discovery-bridge -
f /var/lib/discovery-bridge/identities.db 0660 discovery-bridge-publisher discovery-bridge -
z /var/lib/discovery-bridge/identities.db-wal 0660 - discovery-bridge -
z /var/lib/discovery-bridge/identities.db-shm 0660 - discovery-bridge -
f /var/lib/discovery-bridge/identities.db.feed 0660 discovery-bridge-collector discovery-bridge -
z /var/lib/discovery-bridge/identities.db.feed-wal 0660 - discovery-bridge -
z /var/lib/discovery-bridge/identities.db.feed-shm 0660 - discovery-bridge -
# A separate socket group grants DNS queries without granting SQLite write access.
d /run/discovery-bridge-native 2770 discovery-bridge-collector discovery-bridge-dns -
