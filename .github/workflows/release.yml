name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix; published as a prerelease
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate candidate version and source
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          python3 packaging/release.py prepare --version "$version"

  qualify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      save_artifacts: true

  publish:
    needs: [prepare, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qualified-*
          path: dist/qualified
      - name: Assemble qualified release assets and image index
        run: |
          python3 packaging/release.py assemble --version "$RELEASE_VERSION" \
            --source-commit "$GITHUB_SHA" \
            --qualification-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --input dist/qualified --output dist/release --layout dist/release-index
          (cd dist/release && sha256sum --check SHA256SUMS)
      - name: Publish the exact qualified OCI index
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes skopeo
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/discovery-bridge-registry.json"
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy --all --preserve-digests \
            oci:dist/release-index:release "docker://ghcr.io/mikenorgate/discovery-bridge:v$RELEASE_VERSION"
          python3 packaging/release.py verify-registry --release dist/release
      - name: Publish candidate packages and offline images
        run: |
          gh release create "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Discovery Bridge $RELEASE_VERSION" \
            --prerelease --generate-notes dist/release/*
