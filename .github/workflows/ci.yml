name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Native tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Verify public source and module inputs
        run: |
          python3 tests/check_public.py
          go mod verify
          test -z "$(gofmt -l cmd internal registry)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Go tests and static checks
        run: |
          go vet ./...
          go test -race -shuffle=on -count=1 ./...
          make build
          dist/discovery-bridge version
      - name: Isolated namespace integration
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes iproute2 util-linux dbus
          sudo env "PATH=$PATH" "GOMODCACHE=$(go env GOMODCACHE)" "GOCACHE=$(go env GOCACHE)" go test -race -tags integration -count=1 ./internal/linuxnet ./internal/node ./internal/avahi ./internal/observation
      - name: Restricted container integration
        run: |
          docker build --tag discovery-bridge-integration --file tests/Containerfile.integration tests
          for package in linuxnet node avahi observation; do
            CGO_ENABLED=0 go test -c -tags integration -o "$RUNNER_TEMP/$package.test" "./internal/$package"
            capabilities=()
            if [ "$package" = observation ]; then capabilities+=(--cap-add NET_RAW); fi
            # NET_ADMIN is used by the test harness to create isolated interfaces.
            # Worker permissions remain empty; the broker needs no CAP_KILL.
            docker run --rm --network none --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,exec --tmpfs /run \
              --memory 192m --pids-limit 64 --cap-drop ALL \
              --cap-add SYS_ADMIN --cap-add SYS_PTRACE --cap-add SETUID \
              --cap-add SETGID --cap-add NET_ADMIN \
              "${capabilities[@]}" \
              --security-opt apparmor=unconfined --security-opt no-new-privileges \
              --volume "$RUNNER_TEMP/$package.test:/lab/test:ro" \
              --entrypoint /lab/test discovery-bridge-integration -test.v
          done
      - name: Python reference behavior
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r reference/python/requirements-test.txt
          make reference
          python3 tests/reference_views.py --check
          go test -race -tags reference -count=1 ./internal/gateway ./internal/state

  lint:
    name: Lint and vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
